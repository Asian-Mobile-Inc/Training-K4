apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android' //am_longlv2
apply plugin: 'kotlin-kapt' //am_longlv2

android {
    compileSdkVersion 34

    namespace 'com.example.asian'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        flavorDimensions "default"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {

        am_huynn {
            java.srcDirs = ['src/am_huynn']
        }

        am_longlv {
            java.srcDirs = ['src/am_longlv']
        }

        am_sonhk {
            java.srcDirs = ['src/am_sonhk']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {

        am_huynn {
            applicationId = "com.example.huynn"
        }

        am_longlv {
            applicationId = "com.example.longlv"
        }

        am_sonhk {
            applicationId = "com.example.sonhk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.3.1'
    implementation 'androidx.navigation:navigation-ui:2.3.1'
    implementation 'com.google.android.material:material:1.5.0'

    def room_version = "2.6.1" //am_longlv2
    implementation("androidx.room:room-runtime:$room_version") //am_longlv2
    kapt("androidx.room:room-compiler:$room_version") //am_longlv2
    implementation("androidx.room:room-ktx:$room_version") //am_longlv2
    def lifecycle_version = "2.4.1" //am_longlv2
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version") //am_longlv2
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version") //am_longlv2
    kapt("androidx.lifecycle:lifecycle-compiler:$lifecycle_version") //am_longlv2
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3' // am_longlv2
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3' // am_longlv2
    implementation 'androidx.fragment:fragment-ktx:1.4.0' //am_longlv2
    implementation 'com.squareup.retrofit2:retrofit:2.9.0' //am_longlv2
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0' //am_longlv2
    implementation 'com.google.code.gson:gson:2.11.0' //am_longlv2
    implementation 'com.github.bumptech.glide:glide:4.16.0' //am_longlv2
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0' //am_longlv2
    implementation 'com.squareup.okhttp3:okhttp:4.11.0' //am_longlv2
}
